name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills and generated rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scripts are executable and parse
        run: |
          bash -n scripts/sync-rules.sh
          bash -n validate.sh

      - name: Generate tool-specific rule files
        run: bash scripts/sync-rules.sh

      - name: Verify generated files are in sync
        run: bash scripts/sync-rules.sh --check

      - name: Run validation suite
        run: bash validate.sh

  scaffold:
    name: Generated agent compiles and passes its own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate an agent from the templates
        run: |
          python skills/agent-scaffold/scripts/scaffold.py \
            --name demo_agent \
            --out /tmp/demo_agent \
            --tools run_sql,create_chart \
            --description "answers business questions over the analytics warehouse"

      - name: Check the expected tree was produced
        run: |
          for f in main.py agent.py config.py models.py reliability.py tracing.py \
                   pyproject.toml tools/__init__.py tools/run_sql.py \
                   tools/create_chart.py guardrails/input.py guardrails/output.py \
                   guardrails/tool_guards.py tests/conftest.py tests/test_agent.py \
                   tests/evals/golden.yaml; do
            test -f "/tmp/demo_agent/$f" || { echo "missing: $f"; exit 1; }
          done
          echo "all expected files present"

      - name: Byte-compile every generated file
        run: python -m compileall -q /tmp/demo_agent

      - name: Reject unresolved template placeholders
        run: |
          if grep -rEn '\$\{[a-z_]+\}' /tmp/demo_agent --include='*.py' \
               --include='*.toml' --include='*.md' --include='*.yaml'; then
            echo "unresolved template placeholders found"
            exit 1
          fi
          echo "no unresolved placeholders"

      - name: Run the generated test suite
        run: |
          python -m pip install --quiet pydantic pytest pytest-asyncio
          cd /tmp/demo_agent && python -m pytest

  guardrails:
    name: Generated guardrails pass their own tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both ends of the configuration space: no optional guards, and all
          # of them. The conditional __all__ has to render correctly in each.
          - config: minimal
            flags: ""
            expected_files: 13
          - config: all-guards
            flags: "--all-guards"
            expected_files: 19
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the guardrail package (${{ matrix.config }})
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          mkdir -p /tmp/host
          python skills/guardrail-setup/scripts/add_guardrails.py \
            --out /tmp/host/guardrails $FLAGS

      - name: Check the expected file count
        env:
          EXPECTED: ${{ matrix.expected_files }}
        run: |
          actual=$(find /tmp/host/guardrails -type f | wc -l | tr -d ' ')
          test "$actual" = "$EXPECTED" || { echo "expected $EXPECTED files, got $actual"; exit 1; }
          echo "$actual files, as expected"

      - name: Byte-compile every generated file
        run: python -m compileall -q /tmp/host/guardrails

      - name: Reject unresolved template placeholders
        run: |
          if grep -rEn '\$\{[a-z_]+\}' /tmp/host/guardrails; then
            echo "unresolved template placeholders found"
            exit 1
          fi
          echo "no unresolved placeholders"

      - name: Run the generated test suite
        run: |
          python -m pip install --quiet pydantic pytest
          cd /tmp/host && python -m pytest -q

  manifests:
    name: Validate plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse JSON manifests
        run: |
          python3 -c "import json,sys; json.load(open('.claude-plugin/plugin.json'))"
          python3 -c "import json,sys; json.load(open('.claude-plugin/marketplace.json'))"
          for f in skills/*/evals/evals.json; do
            python3 -c "import json,sys; json.load(open('$f'))" || exit 1
          done

      - name: Check plugin and marketplace versions agree
        run: |
          python3 - <<'PY'
          import json, sys
          plugin = json.load(open(".claude-plugin/plugin.json"))
          market = json.load(open(".claude-plugin/marketplace.json"))
          entry = next(p for p in market["plugins"] if p["name"] == plugin["name"])
          if entry["version"] != plugin["version"]:
              sys.exit(f"version mismatch: plugin.json={plugin['version']} marketplace.json={entry['version']}")
          print(f"versions agree: {plugin['version']}")
          PY
